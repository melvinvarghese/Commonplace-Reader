name: Android foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ false }} # One approved setup-only diagnostic; no app checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4; includes wrapper validation
      - name: Install compile SDK and Build Tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: CI result-guard regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, apps and instrumentation APKs
        run: >-
          ./gradlew --no-daemon --dependency-verification=strict
          :app:testAndroidxDebugUnitTest :app:testComposepdfDebugUnitTest
          :app:lintAndroidxDebug :app:lintComposepdfDebug
          :app:assembleAndroidxDebug :app:assembleComposepdfDebug
          :app:assembleAndroidxDebugAndroidTest :app:assembleComposepdfDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-checks
          retention-days: 7
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
  smoke:
    if: ${{ always() }} # Run setup even though app checks are intentionally skipped.
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ['37.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install compile SDK and Build Tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check out the unchanged pinned emulator action for a setup-only stop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reactivecircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: .diagnostic-emulator-runner
          persist-credentials: false
      - name: Stop the pinned action before emulator launch and all app tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.diagnostic-emulator-runner/lib/main.js')
          source = p.read_text()
          marker = '        // launch an emulator\n'
          assert source.count(marker) == 1, 'Pinned action stop boundary changed'
          p.write_text(source.replace(marker, '        console.log("SETUP_ONLY_STOP: AVD created; emulator boot and app tests not run.");\n        return;\n' + marker))
          PY
      - name: Create API 37 AVD and capture setup identity only
        uses: ./.diagnostic-emulator-runner
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: |
            adb start-server
            mkdir -p build/reports/setup-only
            command -v avdmanager > build/reports/setup-only/avdmanager-path.txt
            readlink -f "$(command -v avdmanager)" > build/reports/setup-only/avdmanager-realpath.txt
            cat "$(dirname "$(readlink -f "$(command -v avdmanager)")")/../source.properties" > build/reports/setup-only/cmdline-tools-source.properties
            cp "$ANDROID_AVD_HOME/test.ini" build/reports/setup-only/test.ini
            cat build/reports/setup-only/avdmanager-path.txt build/reports/setup-only/avdmanager-realpath.txt build/reports/setup-only/cmdline-tools-source.properties build/reports/setup-only/test.ini
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -show-kernel
          script: |
            python3 tools/run_emulator_smoke.py
      - name: Collect emulator failure diagnostics
        if: failure()
        run: |
          mkdir -p build/reports/emulator
          adb devices -l > build/reports/emulator/devices.txt 2>&1
          timeout 20 adb logcat -d > build/reports/emulator/logcat.txt 2>&1 || true
          find "$HOME/.android/avd" -name config.ini -exec cat {} \; > build/reports/emulator/avd-config.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shell-smoke-api-${{ matrix.api }}
          retention-days: 7
          path: |
            build/reports/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
